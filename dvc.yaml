stages:
  raw-data:
    cmd: calkit xenv -n remote --no-check -- calkit xenv -n py --no-check
      -- python scripts/collect.py
    deps:
      - scripts/collect.py
      - .calkit/envs/py/uv.lock
      - .calkit/env-locks/remote/info.json
    outs:
      - data/raw.csv:
          cache: false
          persist: false
    desc: Automatically generated from the 'raw-data' stage in calkit.yaml.
      Changes made here will be overwritten.
  plot:
    cmd: calkit xenv -n py --no-check -- python scripts/plot.py
    deps:
      - scripts/plot.py
      - data/raw.csv
      - .calkit/envs/py/uv.lock
    outs:
      - figures/plot.png
    desc: Automatically generated from the 'plot' stage in calkit.yaml.
      Changes made here will be overwritten.
