schema: '2.0'
stages:
  run-sim:
    cmd: calkit xenv -n cluster -- bash script.sh
    deps:
    - path: script.sh
      hash: md5
      md5: 58b4c9b94ea71048fdb88e753c124ed9
      size: 106
    outs:
    - path: results
      hash: md5
      md5: 744952094a9dd0720499e19bae8018d6.dir
      size: 8
      nfiles: 2
  raw-data:
    cmd: calkit xenv -n remote-machine --no-check --send scripts/collect.py --send
      .calkit/envs/py/uv.lock --send .calkit/env-locks/remote-machine/info.json --get
      data/raw.csv -- calkit xenv -n py --no-check -- python scripts/collect.py
    deps:
