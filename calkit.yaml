owner: calkit
name: example-ssh
hub: calkit.io
title: SSH Example
description: An example of running a Calkit pipeline stage on a remote
  machine via SSH.

dependencies:
  - calkit>=0.42.2
  - kind: env-var
    name: CK_SSH_KEY
  - kind: env-var
    name: CK_SSH_HOST
  - kind: env-var
    name: CK_SSH_USER

environments:
  remote-machine:
    kind: system
    host: ${CK_SSH_HOST}
    user: ${CK_SSH_USER}
    # Choosing a working directory is optional, but recommended
    # TODO: Should this have any effect if we're already on the remote host?
    wdir: ~/calkit/example-ssh # This would be selected by default
    ssh_key: ${CK_SSH_KEY}
    lock:
      - cpu-count
  py:
    kind: uv
    path: .calkit/envs/py/pyproject.toml
    python: "3.12"

pipeline:
  stages:
    raw-data:
      kind: python-script
      script_path: scripts/collect.py
      environment: remote-machine:py
      outputs:
        - path: data/raw.csv
          storage: git
    plot:
      kind: python-script
      script_path: scripts/plot.py
      environment: py
      inputs:
        - data/raw.csv
      outputs:
        - figures/plot.png
