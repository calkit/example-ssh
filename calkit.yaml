owner: calkit
name: example-ssh
hub: calkit.io
title: SSH Example
description: An example of running a Calkit pipeline stage on a remote
  machine via SSH.

dependencies:
  - calkit>=0.42.2
  - kind: env-var
    name: CK_SSH_HOST

environments:
  remote:
    kind: system
    host: ${CK_SSH_HOST}
    # Choosing a working directory is optional. It says where to put the
    # project when it has to be sent here; if you're already on this host,
    # stages run in the checkout you're in and this is ignored. The host is
    # recognized whether it's written as a name or an address, so running
    # from the machine itself skips SSH entirely.
    wdir: ~/calkit/example-ssh
    # Here we choose the properties of the system we want to lock. This means
    # that if one changes, it invalidates a cached stage, which can be useful
    # for ensuring that a stage is re-run if the number of CPUs changes,
    # for example.
    lock:
      - cpu-count
  py:
    kind: uv
    path: .calkit/envs/py/pyproject.toml
    python: "3.12"

pipeline:
  stages:
    raw-data:
      kind: python-script
      script_path: scripts/collect.py
      environment: remote:py
      outputs:
        - path: data/raw.csv
          storage: git
    plot:
      kind: python-script
      script_path: scripts/plot.py
      environment: py
      inputs:
        - data/raw.csv
      outputs:
        - figures/plot.png
