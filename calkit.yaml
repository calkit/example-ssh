owner: calkit
name: example-ssh
hub: calkit.io
title: SSH Example
description: An example of running a Calkit pipeline stage on a remote
  machine via SSH.

dependencies:
  - calkit>=0.42.2
  - kind: env-var
    name: CK_SSH_KEY
  - kind: env-var
    name: CK_SSH_HOST
  - kind: env-var
    name: CK_SSH_USER

environments:
  remote:
    kind: system
    host: ${CK_SSH_HOST}
    user: ${CK_SSH_USER}
    # Choosing a working directory is optional. It says where to put the
    # project when it has to be sent here; if you're already on this host,
    # stages run in the checkout you're in and this is ignored. The host is
    # recognized whether it's written as a name or an address, so running
    # from the machine itself skips SSH entirely.
    wdir: ~/calkit/example-ssh # Otherwise ~/.calkit/workspaces/{hub}/{owner}/{name}
    ssh_key: ${CK_SSH_KEY}
    lock:
      - cpu-count
  py:
    kind: uv
    path: .calkit/envs/py/pyproject.toml
    python: "3.12"

pipeline:
  stages:
    raw-data:
      kind: python-script
      script_path: scripts/collect.py
      environment: remote:py
      outputs:
        - path: data/raw.csv
          storage: git
    plot:
      kind: python-script
      script_path: scripts/plot.py
      environment: py
      inputs:
        - data/raw.csv
      outputs:
        - figures/plot.png
